name: Stock check

# Cloud backup: runs every 15 minutes, but only does something when the computer has been
# silent for a while (asleep / off). While the computer is running, each run just exits.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:          # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser engine
        run: pip install -q curl_cffi tzdata

      - name: Run bot (cloud backup)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py
