name: Stock check

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay a few minutes)
  workflow_dispatch:          # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add products.json state.json
            git commit -m "update stock state"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
